[tools]
zig = "0.17.0"
xcodegen = "2.46.0"
node = "22"

[env]
SAPPHIRE_APP = "build/DerivedData/Build/Products/Release/Devora Sapphire.app"
# Ghostty v1.4.0; the commit is the source of truth, the tag is informational.
GHOSTTY_TAG = "v1.4.0"
GHOSTTY_COMMIT = "83fb95624b0439ee660c2679b43b38c8b63769cd"

[tasks.core]
description = "Build devora-ffi, its Swift bindings and DevoraCoreFFI.xcframework (outputs are only replaced when they change)"
run = "./scripts/build-core.sh"

[tasks.ghostty-fetch]
description = "Clone Ghostty into vendor/ghostty at the pinned commit (GHOSTTY_CLONE_SOURCE overrides the GitHub URL, e.g. with a local clone)"
run = """
set -euo pipefail
if [ ! -d vendor/ghostty/.git ]; then
	mkdir -p vendor
	git clone "${GHOSTTY_CLONE_SOURCE:-https://github.com/ghostty-org/ghostty.git}" vendor/ghostty
	git -C vendor/ghostty checkout --detach "$GHOSTTY_COMMIT"
fi
HEAD_COMMIT=$(git -C vendor/ghostty rev-parse HEAD)
if [ "$HEAD_COMMIT" != "$GHOSTTY_COMMIT" ]; then
	echo "ERROR: vendor/ghostty is at $HEAD_COMMIT, expected $GHOSTTY_COMMIT ($GHOSTTY_TAG)" >&2
	exit 1
fi
"""

[tasks.ghostty-build]
description = "Build GhosttyKit.xcframework (native arch) into build/; needs Xcode's Metal Toolchain and gettext's msgfmt"
depends = ["ghostty-fetch"]
run = """
set -euo pipefail
(cd vendor/ghostty && zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Dxcframework-target=native -Demit-macos-app=false)
mkdir -p build
rsync -a --delete vendor/ghostty/macos/GhosttyKit.xcframework/ build/GhosttyKit.xcframework/
# SwiftPM merges every xcframework's headers into one include/ directory; in a subdirectory, Ghostty's umbrella header doesn't claim the core's headers.
HEADERS=build/GhosttyKit.xcframework/macos-arm64/Headers
mkdir -p "$HEADERS/GhosttyKit"
mv "$HEADERS/ghostty.h" "$HEADERS/module.modulemap" "$HEADERS/GhosttyKit/"
echo "Built build/GhosttyKit.xcframework"
"""

[tasks.ghostty-cache-key]
description = "Print the cache key for build/GhosttyKit.xcframework: the pinned Ghostty commit, the Zig version and the Xcode build"
run = """
echo "ghosttykit-$GHOSTTY_COMMIT-zig$(zig version)-xcode$(xcodebuild -version | awk '/Build version/ {print $3}')"
"""

[tasks.ghostty-prereqs]
description = "For CI: install what ghostty-build needs beyond mise's tools, when missing: Xcode's Metal Toolchain and gettext's msgfmt (a system-wide Homebrew install)"
run = """
set -euo pipefail
xcodebuild -showComponent MetalToolchain >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
command -v msgfmt >/dev/null || brew install gettext
"""

[tasks.web-renderer-install]
description = "Install the shared web renderer's pinned dependencies"
sources = ["../web-renderer/package.json", "../web-renderer/package-lock.json"]
outputs = ["../web-renderer/node_modules/.package-lock.json"]
run = "npm ci --prefix ../web-renderer --no-audit --no-fund"

[tasks.web-renderer]
description = "Build the shared web renderer into the Sapphire resource directory"
depends = ["web-renderer-install"]
sources = ["../web-renderer/package.json", "../web-renderer/package-lock.json", "../web-renderer/index.html", "../web-renderer/vite.config.js", "../web-renderer/src/**/*", "../web-renderer/public/**/*"]
outputs = ["build/web-renderer/index.html", "build/web-renderer/.vite/manifest.json"]
run = "npm run build --prefix ../web-renderer -- --outDir ../project-sapphire/build/web-renderer"

[tasks.generate]
depends = ["web-renderer"]
description = "Generate the thin app target's Xcode project with XcodeGen"
run = "node ./scripts/check-web-renderer.mjs && xcodegen generate --quiet --spec App/project.yml"

[tasks.build]
description = "Build Devora Sapphire.app (builds GhosttyKit first if it is missing)"
depends = ["core", "generate"]
run = """
set -euo pipefail
[ -d build/GhosttyKit.xcframework ] || mise run ghostty-build
xcodebuild -project App/DevoraSapphire.xcodeproj -scheme DevoraSapphire -configuration Release \
	-derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' build -quiet
echo "Built $SAPPHIRE_APP"
"""

[tasks.run]
description = "Run the app through LaunchServices; arguments are --flag value pairs (e.g. --snapshot <out.png>)"
run = 'open -n -W "$SAPPHIRE_APP" --args'

[tasks.bundle]
description = "Build the signed distribution with all shared resources"
run = "../bundler/macos-sapphire/bundle-sapphire.sh"

[tasks.test-bundle]
description = "Package existing build/test-tools outputs, then smoke-test the distribution using the acceptance bridge"
depends = ["npm-install"]
run = '''
set -e
time ../bundler/macos-sapphire/bundle-sapphire.sh --prebuilt
node --import tsx scripts/bundle-smoke.ts
'''

[tasks.test]
description = "Run unit, acceptance, real-input UI (where available) and signed bundle smoke tests"
run = [{ task = "test-unit" }, { task = "test-acceptance" }, { task = "test-ui" }, { task = "test-bundle" }]

[tasks.test-unit]
description = "Run the Swift tests against the real core"
depends = ["core"]
run = """
set -euo pipefail
[ -d build/GhosttyKit.xcframework ] || mise run ghostty-build
swift test
"""

[tasks.npm-install]
description = "Install the acceptance tests' npm dependencies when package.json or the lock file changed"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install --no-audit --no-fund"

[tasks.test-tools]
description = "Build real Debi and CCC fixtures for preview and recorded CLI tests"
sources = ["../project-debi/**/*.go", "../project-debi/go.mod", "../project-debi/go.sum", "../project-core/crates/**/*.rs", "../project-core/crates/**/Cargo.toml", "../project-core/Cargo.toml", "../project-core/Cargo.lock"]
outputs = ["build/test-tools/debi", "build/test-tools/ccc"]
run = '''
set -e
mkdir -p build/test-tools
mise exec -C ../project-debi -- go build -o "$PWD/build/test-tools/debi" .
mise exec -C ../project-core -- cargo build --release -p debi
cp ../project-core/target/release/debi build/test-tools/ccc
'''

[tasks.test-acceptance]
description = "Run the Gherkin acceptance scenarios against the built app, through its test bridge; arguments go to cucumber-js"
depends = ["build", "npm-install", "test-tools"]
run = "node --import tsx ./node_modules/.bin/cucumber-js acceptance/features/ ../acceptance/features/ --tags 'not @ember-only' --import 'acceptance/steps/*.ts' --import 'acceptance/support/*.ts' --format progress"

[tasks.test-ui]
description = "Run the XCUITests, which drive the app with real input; skipped, with the reason, where they can't run"
depends = ["build", "test-tools"]
run = "./scripts/test-ui.sh"
