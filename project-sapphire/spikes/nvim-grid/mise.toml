[tools]
xcodegen = "2.46.0"

[tasks.core]
description = "Build the Rust core, the UniFFI Swift bindings and NvimCoreFFI.xcframework"
run = "./scripts/build-core.sh"

[tasks.generate]
description = "Generate the thin app target's Xcode project with XcodeGen"
run = "xcodegen generate --quiet --spec App/project.yml"

[tasks.build]
description = "Rust -> bindings -> XcodeGen -> xcodebuild (no Xcode UI needed)"
depends = ["core", "generate"]
run = """
set -o pipefail
xcodebuild -project App/NvimGridSpike.xcodeproj -scheme NvimGridSpike -configuration Release \
	-derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' build -quiet
echo "Built build/DerivedData/Build/Products/Release/NvimGridSpike.app"
"""

[tasks.run]
description = "Run the spike app (args as --flag value pairs: --config user|clean, --ext-messages on|off)"
# Through LaunchServices: exec'ing the binary directly stopped opening any window after a few killed runs.
run = "open -n -W build/DerivedData/Build/Products/Release/NvimGridSpike.app --args"

[tasks.test]
description = "MessagePack unit tests and headless nvim --embed integration tests"
depends = ["core"]
run = "swift test"

[tasks.latency-bench]
description = "Keystroke-to-glyph latency, clean and user config (keep the window in front)"
depends = ["build"]
run = """
set -e
APP=build/DerivedData/Build/Products/Release/NvimGridSpike.app
for config in clean user; do
	for draw in cycle flush; do
		FLAG=""; [ "$draw" = flush ] && FLAG="--draw-on-flush yes"
		open -n -W "$APP" --args --config "$config" $FLAG --latency-bench "$PWD/build/latency-$config-$draw.json"
		echo "$config, draw on $draw: $(cat "build/latency-$config-$draw.json")"
	done
done
"""
