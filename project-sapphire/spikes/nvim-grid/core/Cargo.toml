[package]
name = "nvim-spike-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "nvim_spike_core"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "=0.32.2", features = ["cli"] }

[profile.release]
panic = "unwind"
