[tasks.build]
run = "cargo build --release"
description = "Build the judgess binary (release)"

[tasks.test]
run = "cargo test"
description = "Run all tests (including the cases.json regression suite)"

[tasks.lint]
run = """
set -e
cargo fmt --check
cargo clippy --all-targets -- -D warnings
"""
description = "Check formatting (rustfmt) and lint with clippy"

[tasks.classify]
run = "cargo run --release --quiet -- classify"
description = "Interactively label the queue of requests Judgess did not know how to decide"

[tasks.export]
run = "cargo run --release --quiet -- export"
description = "Redact labelled cases and append them to cases.json"
