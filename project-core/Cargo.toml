[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
devora-agent = { path = "crates/devora-agent" }
devora-app = { path = "crates/devora-app" }
devora-config = { path = "crates/devora-config" }
devora-core = { path = "crates/devora-core" }
devora-health = { path = "crates/devora-health" }
devora-ipc = { path = "crates/devora-ipc" }
devora-platform = { path = "crates/devora-platform" }
devora-pty = { path = "crates/devora-pty" }
devora-state = { path = "crates/devora-state" }
devora-terminal = { path = "crates/devora-terminal" }
devora-theme = { path = "crates/devora-theme" }
devora-workspace = { path = "crates/devora-workspace" }
base64 = "0.22"
event-listener = "5"
fs2 = "0.4"
futures-lite = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
portable-pty = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net"] }
uuid = { version = "1", features = ["v4"] }
