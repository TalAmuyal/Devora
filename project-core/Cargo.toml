[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
devora-platform = { path = "crates/devora-platform" }
devora-theme = { path = "crates/devora-theme" }
devora-workspace = { path = "crates/devora-workspace" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
