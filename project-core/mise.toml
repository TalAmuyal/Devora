[tasks.build]
run = "cargo build --release -p debi"
description = "Build the debi binary (release)"

[tasks.test]
run = "cargo test"
description = "Run the core's tests"

[tasks.lint]
run = """
set -e
cargo fmt --check
cargo clippy --all-targets -- -D warnings
"""
description = "Check the core's formatting (rustfmt) and lint it with clippy"
