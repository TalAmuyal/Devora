name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run lint

      - run: mise run test

  test-ember:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-${{ runner.os }}-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-${{ runner.os }}-

      - name: Cache npm modules
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: project-ember/node_modules
          key: ember-npm-${{ runner.os }}-${{ hashFiles('project-ember/package-lock.json') }}
          restore-keys: ember-npm-${{ runner.os }}-

      - name: Install npm dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: mise exec -C project-ember -- npm ci

      - name: Rust format and lint
        run: mise run ember-lint

      - name: Rust tests
        run: mise run ember-test

      - name: TypeScript type-check
        run: mise exec -C project-ember -- npx tsc --noEmit

  e2e-ember:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-${{ runner.os }}-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-${{ runner.os }}-

      - name: Cache npm modules
        id: cache-npm-bdd
        uses: actions/cache@v5
        with:
          path: project-ember/node_modules
          key: ember-npm-${{ runner.os }}-${{ hashFiles('project-ember/package-lock.json') }}
          restore-keys: ember-npm-${{ runner.os }}-

      - name: Install npm dependencies
        if: steps.cache-npm-bdd.outputs.cache-hit != 'true'
        run: mise exec -C project-ember -- npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code || true

      - name: Build Ember
        run: DEVORA_TEST_MODE=1 mise run build-ember-app

      - name: Run acceptance tests
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: mise run -C project-ember test-e2e

      - name: Upload failure captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-captures
          path: project-ember/test-results/failures/
          if-no-files-found: ignore
          retention-days: 14

  # Decides whether the Sapphire job (the slowest, on a macOS runner) can be skipped: only on a pull request whose changed files all can't affect Sapphire (scripts/ci/sapphire-affected.sh); a push to master always runs it.
  # A job skipped by its condition counts as passing for required checks.
  sapphire-changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the path classifier
        run: scripts/ci/sapphire-affected.test.sh

      - name: Classify the changed files
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only "$BASE...$HEAD"); then
            affected=$(printf '%s\n' "$changed" | scripts/ci/sapphire-affected.sh)
          else
            affected=true
          fi
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "Sapphire affected: $affected"

  sapphire:
    needs: sapphire-changes
    if: needs.sapphire-changes.outputs.affected == 'true'
    # macOS 27 with Xcode 27; GitHub names this generation's images after the Xcode major, so there is no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The image's default Xcode moves with patch releases; pin the one Sapphire builds with.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Resolve the GhosttyKit cache key
        id: ghostty-key
        run: echo "key=$(mise run -C project-sapphire ghostty-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghostty
        uses: actions/cache@v5
        with:
          path: project-sapphire/build/GhosttyKit.xcframework
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-core/target
          key: sapphire-rust-${{ hashFiles('project-core/Cargo.lock', 'mise.toml') }}
          restore-keys: sapphire-rust-

      # Building libghostty is slow and needs the Metal Toolchain (missing from the image, actions/runner-images#14548), so it only happens on a cache miss.
      - name: Install GhosttyKit prerequisites
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-prereqs

      - name: Build GhosttyKit.xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-build

      - name: Build the Rust core and its Swift bindings
        run: mise run -C project-sapphire core

      - name: Build the app
        run: mise run -C project-sapphire build

      # Unit tests, the acceptance scenarios over the test bridge, and the XCUITests where they can run.
      - name: Tests
        run: mise run -C project-sapphire test

      - name: Core tests (macOS)
        run: mise run -C project-core test

      - name: Upload acceptance failure captures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sapphire-failure-captures
          path: project-sapphire/test-results/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Disk usage
        if: always()
        run: df -h . && du -sh project-sapphire/build project-sapphire/vendor project-sapphire/.build project-core/target 2>/dev/null || true
