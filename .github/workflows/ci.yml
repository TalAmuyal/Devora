name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run lint

      # The output is kept for its Rust tests' outcomes (libtest prints them as it goes).
      - run: |
          set -o pipefail
          mise run test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Record test outcomes
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-test-outcomes
        with:
          job: test
          results: rust=${{ runner.temp }}/test.log

  test-ember:
    needs: changes
    if: needs.changes.outputs.ember == 'true'
    # Ember's jobs share Sapphire's image: GitHub's macos-15 pool often had no runner to give at busy hours.
    runs-on: xcode-27
    env:
      # The image's default Xcode moves with patch releases; build with the one Sapphire does.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-xcode-27-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-xcode-27-

      # The Rust side only: its tests build in dev mode, which loads the frontend from `devUrl` rather than embedding `dist/`, so they need no npm modules,
      # and `--no-deps` keeps project-ember's automatic npm sync from installing them. The frontend's tests and type-check run on Linux (test-ember-unit).
      - name: Rust format and lint
        run: mise run --no-deps -C project-ember lint-rust

      - name: Rust tests
        run: |
          set -o pipefail
          mise run --no-deps -C project-ember test-rust 2>&1 | tee "$RUNNER_TEMP/rust-tests.log"

      - name: Record test outcomes
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-test-outcomes
        with:
          job: test-ember
          results: rust=${{ runner.temp }}/rust-tests.log

  # Ember's frontend unit tests (Vitest under happy-dom) and type-check: nothing in them is macOS-specific, so they run on Linux.
  test-ember-unit:
    needs: changes
    if: needs.changes.outputs.ember == 'true'
    runs-on: ubuntu-latest
    env:
      # Only node: none of the root tools (Rust, shellcheck) nor the Tauri CLI.
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          working_directory: project-ember
          install_args: node

      - name: Cache npm modules
        uses: actions/cache@v5
        with:
          path: |
            project-ember/node_modules
            web-renderer/node_modules
          key: ember-npm-${{ runner.os }}-${{ hashFiles('project-ember/package-lock.json', 'project-ember/scripts/patch-xterm.ts', 'web-renderer/package-lock.json') }}
          restore-keys: ember-npm-${{ runner.os }}-

      # project-ember's automatic npm sync installs the modules when the cache didn't have them.
      - name: Frontend unit tests (Vitest)
        run: mise run -C project-ember test-unit

      - name: TypeScript type-check
        run: mise exec -C project-ember -- npx tsc --noEmit

      - name: Record test outcomes
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-test-outcomes
        with:
          job: test-ember-unit
          results: vitest=project-ember/test-results/test-outcomes/unit.json

  e2e-ember:
    needs: changes
    if: needs.changes.outputs.ember == 'true'
    # Ember's jobs share Sapphire's image: GitHub's macos-15 pool often had no runner to give at busy hours.
    runs-on: xcode-27
    env:
      # The image's default Xcode moves with patch releases; build with the one Sapphire does.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-xcode-27-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-xcode-27-

      - name: Cache npm modules
        id: cache-npm-bdd
        uses: actions/cache@v5
        with:
          path: |
            project-ember/node_modules
            web-renderer/node_modules
          key: ember-npm-xcode-27-${{ hashFiles('project-ember/package-lock.json', 'project-ember/scripts/patch-xterm.ts', 'web-renderer/package-lock.json') }}
          restore-keys: ember-npm-xcode-27-

      - name: Install npm dependencies
        if: steps.cache-npm-bdd.outputs.cache-hit != 'true'
        run: |
          mise exec -C project-ember -- npm ci --prefix ../web-renderer
          mise exec -C project-ember -- npm ci

      # The version is pinned in scripts/ci/tools/package.json, which Dependabot bumps (its README.md).
      - name: Install Claude Code CLI
        run: |
          version=$(node -p "require(process.env.GITHUB_WORKSPACE + '/scripts/ci/tools/package.json').dependencies['@anthropic-ai/claude-code']")
          npm install -g "@anthropic-ai/claude-code@$version"
          claude --version

      - name: Build Ember
        run: DEVORA_TEST_MODE=1 mise run build-ember-app

      - name: Run acceptance tests
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: mise run -C project-ember test-e2e

      - name: Record test outcomes
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-test-outcomes
        with:
          job: e2e-ember
          results: cucumber=project-ember/test-results/test-outcomes/e2e.json

      - name: Upload failure captures
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-captures
          path: project-ember/test-results/failures/
          if-no-files-found: ignore
          retention-days: 14

  # Decides which macOS jobs a pull request can skip, from the module map (ADR-015, scripts/ci/modules.toml and its lock): Sapphire's when no changed file can affect Sapphire, and Ember's when none can affect Ember; a push to master always runs them.
  # A job skipped by its condition counts as passing for required checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      sapphire: ${{ steps.affected.outputs.sapphire }}
      ember: ${{ steps.affected.outputs.ember }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check the module map
        run: scripts/ci/modules.test.sh

      - name: Classify the changed files
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames: a moved file counts by both its old and new path, so moving a file out of an app still runs its jobs.
          if [ "$EVENT" = pull_request ] && changed=$(git diff --no-renames --name-only "$BASE...$HEAD"); then
            affected=$(printf '%s\n' "$changed" | scripts/ci/affected.sh)
          else
            affected=$(printf '%s\n' sapphire=true ember=true)
          fi
          echo "$affected" >> "$GITHUB_OUTPUT"
          echo "Affected: $(echo $affected)"

  sapphire:
    needs: changes
    if: needs.changes.outputs.sapphire == 'true'
    # macOS 27 with Xcode 27; GitHub names this generation's images after the Xcode major, so there is no macos-27 label.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The image's default Xcode moves with patch releases; pin the one Sapphire builds with.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      # The changes job selects from the committed lock, and can't derive it (no Swift on Linux); this job runs whenever
      # a change could make it stale (a manifest, scripts/ci/, or a push to master), so it checks it here.
      - name: Check the module map's lock is current
        run: mise run ci-modules --check

      - name: Resolve the GhosttyKit cache key
        id: ghostty-key
        run: echo "key=$(mise run -C project-sapphire ghostty-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghostty
        uses: actions/cache@v5
        with:
          path: project-sapphire/build/GhosttyKit.xcframework
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-core/target
          key: sapphire-rust-${{ hashFiles('project-core/Cargo.lock', 'mise.toml') }}
          restore-keys: sapphire-rust-

      # The Swift packages the app depends on (swift-markdown, swift-cmark): SwiftPM's shared clone cache, used by both `swift build` and `xcodebuild`.
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: sapphire-swiftpm-${{ hashFiles('project-sapphire/Package.resolved', 'project-sapphire/Packages/*/Package.resolved') }}
          restore-keys: sapphire-swiftpm-

      # Building libghostty is slow and needs the Metal Toolchain (missing from the image, actions/runner-images#14548), so it only happens on a cache miss.
      - name: Install GhosttyKit prerequisites
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-prereqs

      - name: Build GhosttyKit.xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-build

      - name: Build the Rust core and its Swift bindings
        run: mise run -C project-sapphire core

      - name: Build the app
        run: mise run -C project-sapphire build

      # The version is pinned in scripts/ci/tools/package.json, which Dependabot bumps (its README.md).
      - name: Install Claude Code CLI
        run: |
          version=$(mise exec -C project-sapphire -- node -p "require(process.env.GITHUB_WORKSPACE + '/scripts/ci/tools/package.json').dependencies['@anthropic-ai/claude-code']")
          mise exec -C project-sapphire -- npm install -g "@anthropic-ai/claude-code@$version"
          mise exec -C project-sapphire -- claude --version

      # Unit, acceptance, XCUITests where available, then packaging/smoke reusing the built app and test-tools.
      - name: Tests
        # Its own limit, under the job's 60 minutes, so that a hang outside any one test (xcodebuild or the test runner stuck between tests) still ends early and leaves time for the uploads: green runs take 18 to 28 minutes.
        timeout-minutes: 40
        # The output is kept for the agent CLI's Rust tests' outcomes.
        run: |
          set -o pipefail
          mise run -C project-sapphire test 2>&1 | tee "$RUNNER_TEMP/sapphire-tests.log"

      - name: Core tests (macOS)
        run: |
          set -o pipefail
          mise run -C project-core test 2>&1 | tee "$RUNNER_TEMP/core-tests.log"

      - name: Record test outcomes
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-test-outcomes
        with:
          job: sapphire
          results: |
            swift-testing=project-sapphire/build/test-outcomes/unit.jsonl
            swift-testing=project-sapphire/build/test-outcomes/transcript.jsonl
            cucumber=project-sapphire/build/test-outcomes/acceptance.json
            xcresult=project-sapphire/build/ui-tests.xcresult
            cucumber=project-sapphire/build/test-outcomes/bundle.json
            rust=${{ runner.temp }}/sapphire-tests.log
            rust=${{ runner.temp }}/core-tests.log

      - name: Upload acceptance failure captures
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: sapphire-failure-captures
          path: project-sapphire/test-results/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native UI failure results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: sapphire-ui-failure-results
          path: project-sapphire/build/ui-tests.xcresult/
          if-no-files-found: ignore
          retention-days: 14

      # What the XCUITest watchdog saw when it stopped a hung run (project-sapphire/scripts/ui-test-watchdog.sh): the test, a
      # screenshot, samples of the app and the runner, and XCTest's live logs.
      - name: Upload native UI hang evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: sapphire-ui-hang-evidence
          path: project-sapphire/build/ui-test-hang/
          if-no-files-found: ignore
          retention-days: 14

      - name: Disk usage
        if: always()
        run: df -h . && du -sh project-sapphire/build project-sapphire/vendor project-sapphire/.build project-core/target 2>/dev/null || true

  # Measuring how often a push to master repeats what its pull request's run already tested green (step 1 of reusing PR
  # results; nothing reads it yet). These two jobs only record and report: neither is a required check, both continue on
  # error, and nothing depends on them, so they can't change a run's result.
  # On a pull request: what the run tested (the merge commit's tree) and each job's result.
  reuse-evidence:
    if: always() && github.event_name == 'pull_request'
    needs: [test, test-ember, test-ember-unit, e2e-ember, changes, sapphire]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Record what this run tested
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci/reuse-evidence.sh | tee reuse-evidence.json

      - uses: actions/upload-artifact@v7
        with:
          name: reuse-evidence
          path: reuse-evidence.json
          retention-days: 30

  # On a push to master: per job, whether its pull request's run would let it be reused, or why it must run.
  reuse-verdict:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Check the verdict rules
        run: scripts/ci/reuse-verdict.test.sh

      - name: Decide per job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          read -r pr status < <(scripts/ci/reuse-verdict.sh collect "$GITHUB_REPOSITORY" "$GITHUB_SHA" evidence)
          scripts/ci/reuse-verdict.sh decide "$(git rev-parse 'HEAD^{tree}')" "$pr" "$status" evidence/reuse-evidence.json |
            jq --arg sha "$GITHUB_SHA" --arg pr "$pr" --arg evidence "$status" '{sha: $sha, pr: $pr, evidence: $evidence, verdicts: .}' | tee reuse-verdict.json
          {
            echo "### Reuse of the pull request's results (measurement only)"
            jq -r '.verdicts[] | "- `\(.job)`: \(.verdict) (\(.reason))"' reuse-verdict.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: reuse-verdict
          path: reuse-verdict.json
          retention-days: 45
