name: CD

on:
  workflow_dispatch:
  schedule:
    # Daily at midnight UTC-3 (= 03:00 UTC)
    - cron: '0 3 * * *'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Daily-use gate: flip only after Tal approves stable Sapphire releases.
env:
  SAPPHIRE_STABLE_ENABLED: "false"

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      sapphire: ${{ steps.channel.outputs.sapphire }}
    steps:
      - id: channel
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]] || [[ "$SAPPHIRE_STABLE_ENABLED" == true ]]; then
            echo "sapphire=true" >> "$GITHUB_OUTPUT"
          else
            echo "sapphire=false" >> "$GITHUB_OUTPUT"
          fi

      - id: check
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "Not a first-attempt scheduled run; building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! OUT=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" nightly-last-built 2>&1); then
            echo "::warning::Skip check failed ($OUT); proceeding to build."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$OUT" ]; then
            echo "::notice::No prior nightly marker tag; proceeding to build."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRIOR_SHA=$(echo "$OUT" | awk '{print $1}')
          if [ "$PRIOR_SHA" = "$GITHUB_SHA" ]; then
            SHORT_PRIOR="${PRIOR_SHA:0:7}"
            SHORT_CUR="${GITHUB_SHA:0:7}"
            echo "::notice title=Nightly skipped::master has not advanced since ${SHORT_PRIOR}; skipping build."
            {
              echo "## Nightly build skipped"
              echo "- Prior SHA: \`${SHORT_PRIOR}\`"
              echo "- Current SHA: \`${SHORT_CUR}\`"
              echo "- Decision: no changes since last nightly"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Changes since last nightly (${PRIOR_SHA:0:7} → ${GITHUB_SHA:0:7}); building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - run: mise run test

  test-ember:
    runs-on: macos-15
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-${{ runner.os }}-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-${{ runner.os }}-

      - name: Cache npm modules
        uses: actions/cache@v5
        with:
          path: project-ember/node_modules
          key: ember-npm-${{ runner.os }}-${{ hashFiles('project-ember/package-lock.json') }}
          restore-keys: ember-npm-${{ runner.os }}-

      - name: Rust tests
        run: mise run ember-test

      - name: TypeScript type-check
        run: mise exec -C project-ember -- npx tsc --noEmit

  build-and-release:
    runs-on: macos-15
    needs: [check-changes, test, test-ember]
    if: needs.check-changes.outputs.should-build == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Cache Ember Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-ember/src-tauri/target
          key: ember-rust-${{ runner.os }}-${{ hashFiles('project-ember/src-tauri/Cargo.lock') }}
          restore-keys: ember-rust-${{ runner.os }}-

      - name: Cache Ember npm modules
        uses: actions/cache@v5
        with:
          path: project-ember/node_modules
          key: ember-npm-${{ runner.os }}-${{ hashFiles('project-ember/package-lock.json') }}
          restore-keys: ember-npm-${{ runner.os }}-

      - name: Build Ember variant
        run: mise run ember-bundle

      - name: Create Ember DMG
        run: mise run ember-create-dmg

      - name: Smoke test
        run: |
          EMBER_APP="project-ember/src-tauri/target/release/bundle/macos/Devora Ember.app"
          echo "Ember app: $EMBER_APP"

          # Verify the Ember .app exists and has the expected binary
          test -d "$EMBER_APP"
          test -f "$EMBER_APP/Contents/MacOS/devora-ember"

          # Verify bundled resources were copied
          test -f "$EMBER_APP/Contents/Resources/bundled-apps/debi"
          test -x "$EMBER_APP/Contents/Resources/cc-plugins/judgess/judgess"
          test -f "$EMBER_APP/Contents/Resources/cc-plugins/judgess/hooks/hooks.json"

          # Verify version was patched in Info.plist (should not be the tauri.conf.json placeholder)
          EMBER_VERSION=$(plutil -extract CFBundleShortVersionString raw "$EMBER_APP/Contents/Info.plist")
          echo "Ember version in plist: $EMBER_VERSION"
          if [ "$EMBER_VERSION" = "0.1.0" ]; then
            echo "Error: Ember version was not patched in Info.plist"
            exit 1
          fi

          # Verify the brand app icon was generated into the bundle
          test -f "$EMBER_APP/Contents/Resources/app.icns"

          # Verify the Ember display name, stable bundle id and DMG
          test "$(plutil -extract CFBundleDisplayName raw "$EMBER_APP/Contents/Info.plist")" = "Devora Ember"
          test "$(plutil -extract CFBundleIdentifier raw "$EMBER_APP/Contents/Info.plist")" = "com.devora-org.devora"

          # Verify the Devora Ember DMG was created
          test -f "project-ember/src-tauri/target/release/bundle/macos/Devora-Ember.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: ember-dmg
          path: project-ember/src-tauri/target/release/bundle/macos/Devora-Ember.dmg
          if-no-files-found: error

  build-sapphire:
    needs: [check-changes, test]
    if: needs.check-changes.outputs.should-build == 'true' && needs.check-changes.outputs.sapphire == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Resolve the GhosttyKit cache key
        id: ghostty-key
        run: echo "key=$(mise run -C project-sapphire ghostty-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghostty
        uses: actions/cache@v5
        with:
          path: project-sapphire/build/GhosttyKit.xcframework
          key: ${{ steps.ghostty-key.outputs.key }}

      - name: Cache Rust build artifacts
        uses: actions/cache@v5
        with:
          path: project-core/target
          key: sapphire-rust-${{ hashFiles('project-core/Cargo.lock', 'mise.toml') }}
          restore-keys: sapphire-rust-

      # The Swift packages the app depends on (swift-markdown, swift-cmark): SwiftPM's shared clone cache, used by both `swift build` and `xcodebuild`.
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: sapphire-swiftpm-${{ hashFiles('project-sapphire/Package.resolved') }}
          restore-keys: sapphire-swiftpm-

      # Building libghostty is slow and needs the Metal Toolchain (missing from the image, actions/runner-images#14548), so it only happens on a cache miss.
      - name: Install GhosttyKit prerequisites
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-prereqs

      - name: Build GhosttyKit.xcframework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: mise run -C project-sapphire ghostty-build

      - name: Bundle Sapphire
        run: mise run sapphire-bundle

      - name: Install bundle smoke dependencies
        run: mise run -C project-sapphire npm-install

      - name: Smoke test the signed bundle
        run: mise exec -C project-sapphire -- node --import tsx scripts/bundle-smoke.ts

      - name: Create Sapphire DMG
        run: mise run sapphire-create-dmg

      - uses: actions/upload-artifact@v7
        with:
          name: sapphire-dmg
          path: project-sapphire/build/bundle/Devora-Sapphire.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [check-changes, build-and-release, build-sapphire]
    # Publish Ember on either channel even if Sapphire failed or was skipped.
    if: always() && !cancelled() && needs.build-and-release.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ember-dmg
          path: release

      - uses: actions/download-artifact@v8
        if: needs.check-changes.outputs.sapphire == 'true' && needs.build-sapphire.result == 'success'
        with:
          name: sapphire-dmg
          path: release

      - name: Report Sapphire failure
        if: needs.check-changes.outputs.sapphire == 'true' && needs.build-sapphire.result != 'success'
        run: |
          echo "::warning::Sapphire did not succeed; publishing Ember only. See build-sapphire."
          echo "Sapphire failed or was skipped. Ember is published independently; see build-sapphire for details." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SAPPHIRE_ENABLED: ${{ needs.check-changes.outputs.sapphire }}
          SAPPHIRE_RESULT: ${{ needs.build-sapphire.result }}
        run: |
          ASSETS=(release/*.dmg)
          SAPPHIRE_NOTE=""
          if [[ "$SAPPHIRE_ENABLED" == true && "$SAPPHIRE_RESULT" != success ]]; then
            SAPPHIRE_NOTE="Sapphire is unavailable in this release: its build failed or was skipped. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Stable release
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"

            # Extract release notes from CHANGELOG.md for this version
            # Get content between "## VERSION" and the next "## " header
            NOTES=$(awk -v ver="## ${VERSION}" '$0 == ver { found=1; next } /^## / { found=0 } found { print }' CHANGELOG.md)

            if [ -z "$NOTES" ]; then
              NOTES="Release ${VERSION}"
            fi

            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Devora $VERSION" \
              --notes "$NOTES${SAPPHIRE_NOTE:+$'\n\n'$SAPPHIRE_NOTE}"
          else
            # Nightly release
            DATE=$(date -u +%Y-%m-%d)
            NIGHTLY_TAG="nightly-${DATE}"
            SHORT_SHA="${GITHUB_SHA:0:7}"

            NIGHTLY_NOTES=$(cat <<EOF
          Automated nightly build from master.

          **Commit:** ${SHORT_SHA}
          **Date:** ${DATE}

          ${SAPPHIRE_NOTE}

          > This is a pre-release build and may be unstable.
          EOF
            )

            # Create dated nightly release
            # Delete if it already exists (e.g., re-run on same day)
            gh release delete "$NIGHTLY_TAG" --cleanup-tag --yes 2>/dev/null || true

            gh release create "$NIGHTLY_TAG" "${ASSETS[@]}" \
              --prerelease \
              --title "Nightly Build ($DATE)" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --notes "$NIGHTLY_NOTES"

            LATEST_NOTES=$(cat <<EOF
          Rolling nightly build — always points to the latest nightly.

          **Commit:** ${SHORT_SHA}
          **Date:** ${DATE}

          ${SAPPHIRE_NOTE}

          > This is a pre-release build and may be unstable.
          EOF
            )

            # Update rolling nightly-latest alias
            gh release delete nightly-latest --cleanup-tag --yes 2>/dev/null || true

            gh release create nightly-latest "${ASSETS[@]}" \
              --prerelease \
              --title "Nightly Build (Latest)" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --notes "$LATEST_NOTES"

            # Advance the marker tag used by check-changes to detect whether
            # master has moved since the last successful nightly publish.
            # Retry an incomplete Sapphire nightly next schedule, even at the same SHA.
            if [[ "$SAPPHIRE_ENABLED" != true || "$SAPPHIRE_RESULT" == success ]]; then
              git tag -f nightly-last-built "$GITHUB_SHA"
              git push -f origin nightly-last-built
            fi
          fi
