[settings]
experimental = true # Required for the 'deps' feature in sub-project tasks (mise run -C ...)

[tools]
shellcheck = "latest"
rust = { version = "1.99.1", components = "rustfmt,clippy" }
"cargo:tauri-cli" = "2.11.1"

[tasks.build]
run = """
set -e
mise run -C project-core build
mise run -C project-debi build
mise run -C project-status-line build
mise run -C project-judgess build
"""
description = "Build all sub-projects (core debi, Go debi, cc-simple-statusline, judgess)"

[tasks.clean]
run = """
set -e
rm -rf bin/
"""
description = "Clean build artifacts"

[tasks.test]
run = """
set -e
mise run -C project-core test
mise run -C project-debi test
mise run -C project-judgess test
mise run -C project-status-line test
"""
description = "Run tests for all sub-projects"

[tasks.lint]
run = """
set -e
mise run -C project-core lint
mise run -C project-judgess lint
"""
description = "Check Rust formatting and lint with clippy (core, judgess; Ember has ember-lint)"

[tasks.lint-shell]
run = "shellcheck install.sh bundler/macos-ember/populate-app-resources.sh bundler/macos-ember/install-completions.sh"
description = "Lint shell scripts with shellcheck"

[tasks.release]
run = "./cut-release.sh"
raw = true
description = "Cut a new release (interactive)"

[tasks.install-hooks]
run = """
set -e
HOOKS_DIR="$(git rev-parse --git-path hooks)"
REPO_ROOT="$(git rev-parse --show-toplevel)"
mkdir -p "$HOOKS_DIR"
ln -sf "$REPO_ROOT/scripts/hooks/pre-commit" "$HOOKS_DIR/pre-commit"
echo "Installed pre-commit hook: $HOOKS_DIR/pre-commit -> $REPO_ROOT/scripts/hooks/pre-commit"
"""
description = "Install local git hooks (pre-commit changelog check)"

[tasks.build-ember-app]
depends = ["build"]
description = "Build Devora Ember .app and populate all bundled resources"
run = """
set -e
BUNDLE_DIR="project-ember/src-tauri/target/release/bundle/macos"
find "$BUNDLE_DIR" -name '*.app' -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
(cd project-ember && mise exec -- cargo tauri build --bundles app)
APP_DIR=$(find "$BUNDLE_DIR" -name '*.app' -maxdepth 1 -type d | head -1)
if [ -z "$APP_DIR" ]; then
	echo "ERROR: No .app directory found in $BUNDLE_DIR" >&2
	exit 1
fi
./bundler/macos-ember/populate-app-resources.sh "$APP_DIR" --version 0.0.0-test
"""

[tasks.ember-create-dmg]
description = "Create a DMG from an existing Devora Ember .app bundle"
run = "mise run -C project-ember create-dmg"

[tasks.ember-test]
description = "Run Devora Ember tests"
run = "mise run -C project-ember test-all"

[tasks.ember-lint]
description = "Check Devora Ember's Rust formatting and lint it with clippy"
run = "mise run -C project-ember lint-rust"

[tasks.ember-bundle]
description = "Build the complete Devora Ember.app bundle with all resources"
run = "./bundler/macos-ember/bundle-ember.sh"

[tasks.mac-install]
description = "Build and install Devora.app to /Applications (or --path), plus zsh completion (close Devora first). Untagged source builds install as Devora-<version>.app; --suffix <s> installs as Devora-<s>.app and shows the suffix in the window title and app name."
usage = '''
flag "-p --path <path>" default="/Applications" help="Directory to install the app into"
flag "-s --suffix <suffix>" help="Install as Devora-<suffix>.app, with the suffix shown in the window title and app name"
'''
run = """
set -e

INSTALL_DIR="${usage_path:-/Applications}"
SUFFIX="${usage_suffix:-}"

if [[ ! -d "$INSTALL_DIR" ]]; then
	echo "Error: install directory does not exist: $INSTALL_DIR" >&2
	exit 1
fi

./bundler/macos-ember/bundle-ember.sh

# The Tauri build emits Devora-Ember.app; the "Devora" name is applied here, at the install boundary.
APP_SRC="project-ember/src-tauri/target/release/bundle/macos/Devora-Ember.app"
VERSION=$(cat "$APP_SRC/Contents/Resources/VERSION")
if [[ -n "$SUFFIX" ]]; then
	APP_NAME="Devora-${SUFFIX}"
	# Read by Ember for the window title; the plist names drive the menu bar, Dock, and Cmd+Tab.
	printf "%s" "$SUFFIX" > "$APP_SRC/Contents/Resources/INSTALL_SUFFIX"
	plutil -replace CFBundleName -string "$APP_NAME" "$APP_SRC/Contents/Info.plist"
	plutil -replace CFBundleDisplayName -string "$APP_NAME" "$APP_SRC/Contents/Info.plist"
elif [[ "$VERSION" == *-dev.* ]]; then
	APP_NAME="Devora-${VERSION}"
else
	APP_NAME="Devora"
fi
APP_DEST="${INSTALL_DIR%/}/${APP_NAME}.app"
rm -rf "$APP_DEST"
mv "$APP_SRC" "$APP_DEST"
echo "Installed to $APP_DEST"
./bundler/macos-ember/install-completions.sh "$APP_DEST"
"""
